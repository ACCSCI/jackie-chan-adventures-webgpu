<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>水墨流风 · 战斗 HUD 原型</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;color:#e4dfd3;background:#151715}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{padding:27px 40px 23px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff0d}header h1{font-family:KaiTi,STKaiti,serif;letter-spacing:.18em;font-weight:400;font-size:25px;margin:4px 0 7px}header p{font-size:11px;letter-spacing:.14em;color:#9a9d92;margin:0}.edition{font-size:10px;letter-spacing:.2em;color:#b5a47a}.stage{position:relative;margin:24px 32px 0;aspect-ratio:16/8;overflow:hidden;background:#655b43 url(assets/game-background.png) center/cover}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#10110e66,transparent 40%),linear-gradient(90deg,transparent 65%,#181a171c)}.corner-note{position:absolute;left:25px;top:22px;font-size:10px;letter-spacing:.2em;color:#eee7d4a6}.hud{position:absolute;z-index:1;right:36px;bottom:20px;width:236px;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 2px 2px #14160fde)}.current{position:relative;width:112px;height:106px;display:grid;place-items:center}.current:before{content:"";position:absolute;inset:7px -15px;background:radial-gradient(ellipse,#e3dec40e,transparent 66%);transform:rotate(-20deg)}.current img{width:112px;height:112px;object-fit:contain;opacity:.84}.mode-title{margin-top:-6px;display:flex;align-items:center;gap:10px;font-family:KaiTi,STKaiti,serif;font-size:14px;letter-spacing:.3em;color:#f0ebdbcc}.mode-title:before,.mode-title:after{content:"";width:20px;height:1px;background:linear-gradient(90deg,transparent,#e8ddbd66)}.mode-title:after{transform:rotate(180deg)}.styles{display:flex;align-items:end;gap:13px;margin-top:9px}.style{position:relative;border:0;background:none;color:#e5ddc2;padding:0;width:66px;display:flex;flex-direction:column;align-items:center;opacity:.64;transition:opacity .25s,transform .25s}.style img{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 0 1px #f2e9d3aa)}.style .name{font-family:KaiTi,STKaiti,serif;font-size:12px;letter-spacing:.2em;line-height:19px}.style .number{font-family:Georgia,serif;font-size:10px;color:#e7dfc491;margin-top:4px}.style[aria-pressed=true]{opacity:.96;transform:translateY(-3px)}.style[aria-pressed=true]:before{content:"";position:absolute;left:9px;right:9px;bottom:26px;height:55px;background:radial-gradient(ellipse,#d8ba6d18,transparent 69%);z-index:-1}.style[aria-pressed=true]:after{content:"";position:absolute;bottom:-7px;width:3px;height:3px;background:#d7bf88;transform:rotate(45deg);box-shadow:0 0 5px #c8ad6555}.style:focus-visible{outline:1px solid #c6b48a;outline-offset:4px}.hint{margin-top:17px;font-size:9px;letter-spacing:.13em;color:#e8e1c866}.controls{margin:0 32px;padding:22px 8px;display:flex;justify-content:space-between;align-items:center;gap:20px}.controls .intro{font-size:12px;line-height:1.9;color:#969a90}.controls strong{font-weight:400;color:#dbd7ca}.switches{display:flex;gap:8px}.switches button{border:1px solid #fff2;background:transparent;padding:9px 20px;border-radius:2px;font-size:12px;color:#b9bbae}.switches button[aria-pressed=true]{border-color:#b5a47a99;color:#e4d8b9;background:#b5a47a12}.asset-study{margin:0 32px 24px;padding:22px 30px;background:#111310;display:flex;justify-content:space-around;border-top:1px solid #ffffff0b}.asset-study figure{margin:0;text-align:center}.asset-study figure:nth-child(n+3) img{background:#d5c7a5;border-radius:2px;padding:8px;opacity:1}.asset-study img{width:105px;height:105px;object-fit:contain;opacity:.8}.asset-study figcaption{font:13px KaiTi,serif;letter-spacing:.3em;color:#a5a99a}.caption{font-size:10px;color:#6e7569;text-align:center;letter-spacing:.15em;padding-bottom:20px}@media(max-width:800px){header{padding:20px}.stage{margin:12px;aspect-ratio:4/3}.hud{right:15px;bottom:18px;transform:scale(.8);transform-origin:bottom right}.controls{margin:0 15px;flex-wrap:wrap}.corner-note{font-size:8px}}@media(prefers-reduced-motion:reduce){.style{transition:none}}
</style>
<header><div><p>JACKIE CHAN ADVENTURES / HUD STUDY</p><h1>水墨流风</h1></div><span class="edition">战斗界面原型 · 01</span></header>
<main>
<div class="stage"><span class="corner-note">实景叠加预览 / 右下角 HUD</span>
<div class="hud">
<div class="current" role="status" aria-label="当前拳法"><img id="modeIcon" src="assets/fist-compact.png" alt="毛笔气流拳头"></div><div class="mode-title" id="modeTitle">拳法</div>
<div class="styles" aria-label="套路选择">
<button class="style" data-style="0" aria-pressed="true" aria-label="龙形拳"><img src="assets/dragon-ink.png" alt=""><span class="name">龙形</span><span class="number">1</span></button>
<button class="style" data-style="1" aria-pressed="false" aria-label="蛇形拳"><img src="assets/snake-ink.png" alt=""><span class="name">灵蛇</span><span class="number">2</span></button>
<button class="style" data-style="2" aria-pressed="false" aria-label="醉拳"><img src="assets/gourd-left.png" alt=""><span class="name">醉拳</span><span class="number">3</span></button>
</div><div class="hint">滚轮 切拳腿　·　1 / 2 / 3 换套路</div>
</div></div>
<div class="controls"><div class="intro"><strong>拳腿标志用流风，龙蛇醉用国画水墨。</strong><br>拳腿：银白气流半透 · 套路：浓淡国画黑墨；点选下方模式或使用滚轮、数字键预览。</div><div class="switches"><button data-mode="fist" aria-pressed="true">拳法状态</button><button data-mode="kick" aria-pressed="false">腿法状态</button></div></div>
<div class="asset-study" aria-label="笔触素材放大预览"><figure><img src="assets/fist-compact.png" alt="气流拳头"><figcaption>拳</figcaption></figure><figure><img src="assets/kick.png" alt="气流侧踹"><figcaption>腿</figcaption></figure><figure><img src="assets/dragon-ink.png" alt="盘龙"><figcaption>龙</figcaption></figure><figure><img src="assets/snake-ink.png" alt="灵蛇"><figcaption>蛇</figcaption></figure><figure><img src="assets/gourd-left.png" alt="倾倒洒酒的酒葫芦"><figcaption>醉</figcaption></figure></div><div class="caption">设计原型 · 已集成游戏 · <a href="../../dist/index.html" style="color:#b5a47a">进入游戏试玩</a></div>
</main>
<script>
let mode='fist',last=0;function setMode(next){mode=next;document.getElementById('modeIcon').src='assets/'+(mode==='fist'?'fist-compact':'kick')+'.png';document.getElementById('modeIcon').alt=mode==='fist'?'毛笔气流拳头':'毛笔气流侧踹';document.getElementById('modeTitle').textContent=mode==='fist'?'拳法':'腿法';document.querySelector('.current').setAttribute('aria-label','当前'+document.getElementById('modeTitle').textContent);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));function setStyle(i){document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.style)===i))}document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>setStyle(Number(b.dataset.style))));document.querySelector('.stage').addEventListener('wheel',e=>{e.preventDefault();const t=performance.now();if(t-last>220&&e.deltaY)setMode(mode==='fist'?'kick':'fist');last=t},{passive:false});addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key))setStyle(Number(e.key)-1);if(e.code==='KeyX'&&!e.repeat)setMode(mode==='fist'?'kick':'fist')});
</script>
</html>
